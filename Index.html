<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Unlock Script</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #020617, #0f172a);
      font-family: Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card {
      background: #0f172a;
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🚀 Unlock Script</h1>
  <p>Clique no botão abaixo para liberar o acesso</p>

  <button onclick="unlock()">Unlock Script</button>

  <div class="status" id="status"></div>
</div>

<script>
function getHWID() {
  // simulação simples (você pode mandar pelo script Roblox)
  return localStorage.getItem("hwid") || Math.random().toString(36).substring(2);
}

async function unlock() {
  const hwid = getHWID();

  localStorage.setItem("hwid", hwid);

  const res = await fetch(`/unlock?hwid=${hwid}`);
  const data = await res.json();

  document.getElementById("status").innerText = data.message;
}
</script>

</body>
</html>
